# Spring Application Name
spring.application.name=Qualitrack Platform

# Default profile
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.iotech.qualitrack.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.title=Qualitrack API
documentation.application.description=Qualitrack Platform REST API Documentation
documentation.application.version=1.0.0

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Staff credentials e-mail (optional). Set SPRING_MAIL_HOST (e.g. smtp.gmail.com), SPRING_MAIL_PORT (587),
# SPRING_MAIL_USERNAME (the sending account) and SPRING_MAIL_PASSWORD (for Gmail, an app password), and optionally
# QUALITRACK_MAIL_FROM (e.g. "QualiTrack <account@gmail.com>"). Without SPRING_MAIL_HOST nothing is sent and the
# temporary password is shown once to the quality manager who registers the staff member; the same happens when the
# server cannot be reached (the timeouts keep the registration from waiting on a blocked SMTP port).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
qualitrack.mail.from=${QUALITRACK_MAIL_FROM:}
qualitrack.web.sign-in-url=${QUALITRACK_WEB_SIGN_IN_URL:http://localhost:4200/iam/sign-in}
